<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Smartbook</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="favicon.ico"
    />
    <script>
      (function () {
        try {
          const stored = localStorage.getItem(
            'smartbook-theme',
          );
          if (stored === 'dark') {
            document.documentElement.setAttribute(
              'data-theme',
              'dark',
            );
            document.documentElement.classList.add(
              'dark',
            );
          } else {
            document.documentElement.setAttribute(
              'data-theme',
              'light',
            );
            document.documentElement.classList.remove(
              'dark',
            );
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
