<div
  class="modal-overlay"
  [class.visible]="visible"
  (click)="onBackdropClick($event)"
>
  <div
    class="modal-content"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-header">
      <div class="modal-icon charge-icon">
        <app-icon
          [icon]="LucideFileText"
          [size]="28"
        ></app-icon>
      </div>
      <h3>Apply Charge</h3>
      <p>Charge the user for this incident</p>
    </div>

    <form
      #chargeForm="ngForm"
      (ngSubmit)="onSubmit()"
    >
      <div class="modal-body">
        <div class="form-field">
          <label>Charge Amount (KES)</label>
          <input
            type="number"
            name="chargeAmount"
            [(ngModel)]="chargeAmount"
            placeholder="Enter amount"
            min="0"
            step="0.01"
            required
          />
        </div>
        <div class="form-field">
          <label>Reason</label>
          <input
            type="text"
            name="chargeReason"
            [(ngModel)]="chargeReason"
            placeholder="e.g., Wall damage repair cost"
          />
        </div>
      </div>

      <div class="modal-actions">
        <button
          type="button"
          class="btn-secondary"
          (click)="onCancel()"
          [disabled]="loading"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="btn-primary btn-charge-action"
          [disabled]="
            loading ||
            !chargeAmount ||
            chargeForm.invalid
          "
        >
          @if (loading) {
            <svg
              class="spinner"
              [lucideIcon]="LucideLoader"
              [size]="16"
              [strokeWidth]="2"
            ></svg>
          }
          Apply Charge
        </button>
      </div>
    </form>
  </div>
</div>
