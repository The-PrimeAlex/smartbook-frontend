<div class="page-container">
  <app-page-banner
    [icon]="LucideSettings"
    eyebrow="Settings"
    title="Preferences"
    description="Manage your display preferences."
  ></app-page-banner>

  <div class="preferences-card">
    <!-- Dark Mode Toggle -->
    <div class="pref-field dark-mode-field">
      <div class="dark-mode-header">
        <div>
          <label class="pref-label">Dark Mode</label>
          <p class="pref-description">
            Switch between light and dark theme for a more comfortable viewing
            experience.
          </p>
        </div>
        <button
          class="toggle-switch"
          [class.active]="darkMode()"
          (click)="toggleDarkMode()"
          aria-label="Toggle dark mode"
        >
          <span class="toggle-slider">
            <span class="toggle-icon">
              @if (darkMode()) {
                <app-icon [icon]="LucideMoon" [size]="16"></app-icon>
              } @else {
                <app-icon [icon]="LucideSun" [size]="16"></app-icon>
              }
            </span>
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
