<div
  class="time-picker-wrap"
  [class.disabled]="disabled"
  [class.open]="dropdownOpen"
>
  <!-- Typable input with trigger -->
  <div class="time-input-wrap">
    <input
      type="text"
      class="time-input login-form-input"
      [value]="displayValue"
      [placeholder]="placeholder"
      [disabled]="disabled"
      (input)="onInputChange($event)"
      (focus)="onInputFocus()"
      (blur)="onInputBlur()"
      (click)="toggleDropdown()"
      autocomplete="off"
    />
    <span
      class="time-icon"
      aria-hidden="true"
      (click)="toggleDropdown()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    </span>
    <span
      class="chevron-icon"
      aria-hidden="true"
      (click)="toggleDropdown()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </span>
  </div>

  <!-- Dropdown panel -->
  <div class="time-dropdown" *ngIf="dropdownOpen">
    <div class="time-dropdown-header">Select Time</div>
    <div class="time-columns">
      <div class="time-column">
        <div class="time-column-label">Hour</div>
        <div class="time-scroll">
          <button
            type="button"
            class="time-option"
            *ngFor="let h of hours"
            [class.selected]="selectedHour === h"
            (click)="selectHour(h)"
          >
            {{ h % 12 || 12 }} {{ h < 12 ? 'AM' : 'PM' }}
          </button>
        </div>
      </div>
      <div class="time-column">
        <div class="time-column-label">Minute</div>
        <div class="time-scroll">
          <button
            type="button"
            class="time-option"
            *ngFor="let m of minutes"
            [class.selected]="selectedMinute === m"
            (click)="selectMinute(m)"
          >
            {{ m | number: '2.0' }}
          </button>
        </div>
      </div>
    </div>
    <div class="time-dropdown-footer" *ngIf="isValueSet">
      <span class="time-preview">{{ displayValue }}</span>
    </div>
  </div>
</div>
