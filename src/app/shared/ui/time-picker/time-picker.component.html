<div
  class="time-picker-wrap"
  [class.disabled]="disabled"
  [class.open]="dropdownOpen"
>
  <!-- Readonly input with trigger -->
  <div class="time-input-wrap">
    <input
      type="text"
      class="time-input login-form-input"
      [placeholder]="placeholder"
      [disabled]="disabled"
      readonly
      (click)="toggleDropdown()"
      autocomplete="off"
    />
    <span class="time-icon" aria-hidden="true" (click)="toggleDropdown()">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    </span>
    <span class="chevron-icon" aria-hidden="true" (click)="toggleDropdown()">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </span>
  </div>

  <!-- Dropdown panel -->
  <div class="time-dropdown" *ngIf="dropdownOpen">
    <div class="time-dropdown-header">Select Time</div>
    <div class="time-columns">
      <div class="time-column">
        <div class="time-column-label">Hour</div>
        <div class="time-scroll">
          <button
            type="button"
            class="time-option"
            *ngFor="let h of hours12"
            [class.selected]="selectedHour === h"
            (click)="selectHour(h)"
          >
            {{ h }}
          </button>
        </div>
      </div>
      <div class="time-column time-column-ampm">
        <div class="time-column-label">Period</div>
        <div class="time-scroll">
          <button
            type="button"
            class="time-option ampm-option"
            [class.selected]="selectedAmPm === 'AM'"
            (click)="selectAmPm('AM')"
          >
            AM
          </button>
          <button
            type="button"
            class="time-option ampm-option"
            [class.selected]="selectedAmPm === 'PM'"
            (click)="selectAmPm('PM')"
          >
            PM
          </button>
        </div>
      </div>
      <div class="time-column">
        <div class="time-column-label">Minute</div>
        <div class="time-scroll">
          <button
            type="button"
            class="time-option"
            *ngFor="let m of minutes"
            [class.selected]="selectedMinute === m"
            (click)="selectMinute(m)"
          >
            {{ m | number: '2.0' }}
          </button>
        </div>
      </div>
    </div>
    <div class="time-dropdown-footer" *ngIf="selectedHour !== null && selectedAmPm !== null">
      <span class="time-preview">{{ selectedHour }}:{{ selectedMinute !== null ? (selectedMinute | number: '2.0') : '--' }} {{ selectedAmPm }}</span>
    </div>
  </div>
</div>
